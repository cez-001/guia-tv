name: Atualizar programação
on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XMLTV
        run: sudo apt-get update && sudo apt-get install -y xmltv-util
      - name: Obter programação
        run: python3 scripts/fetch.py
      - name: Guardar alterações
        run: |
          git config user.name "guia-tv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/epg.json
          git diff --cached --quiet || (git commit -m "Atualizar programação" && git push)
