<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Guia TV</title>
<style>
:root{
  --bg:#090b10; --bg2:#0e121b; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.08); --txt:#f2f4f8; --dim:#8c95a8; --acc:#6ea8ff; --acc2:#9a7bff;
  --live:#ff4d6d; --glow:rgba(110,168,255,.16); --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f5f9; --bg2:#e9edf5; --surface:#ffffff; --surface2:#f0f3f9;
    --line:rgba(15,25,50,.09); --txt:#0e1424; --dim:#667088; --acc:#2f6dff; --acc2:#7a4dff;
    --live:#e8264a; --glow:rgba(47,109,255,.12); --shadow:0 8px 24px rgba(30,45,90,.10);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--txt);font:16px/1.35 var(--font);min-height:100vh;
  background:radial-gradient(900px 420px at 85% -80px,var(--glow),transparent 70%),linear-gradient(var(--bg),var(--bg2)) fixed;
  padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:auto;padding:0 16px}

/* topo */
.hero{padding:calc(env(safe-area-inset-top) + 22px) 0 6px;display:flex;align-items:flex-end;justify-content:space-between}
.hero small{display:block;color:var(--dim);font-size:13px;letter-spacing:.01em;margin-bottom:2px}
.hero h1{margin:0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.clock{font-size:34px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--dim);transition:.2s}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 6px 18px var(--glow)}

/* cartões */
.list{display:grid;gap:12px;padding:12px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;
  animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.head{display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px;background:none;border:0;text-align:left;cursor:pointer}
.badge{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;
  font-variant-numeric:tabular-nums;color:var(--acc);
  background:linear-gradient(145deg,var(--glow),transparent),var(--surface2);border:1px solid var(--line)}
.info{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.chname{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--live);background:color-mix(in srgb,var(--live) 14%,transparent);
  padding:3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:5px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.title{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title.none{color:var(--dim);font-weight:500;font-size:16px}
.prog{height:5px;border-radius:5px;background:var(--surface2);margin:11px 0 7px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.next{display:flex;gap:8px;align-items:baseline;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:14px;color:var(--dim)}
.next b{color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}
.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;color:var(--dim);transition:transform .25s;margin-top:4px}
.card.open .chev{transform:rotate(180deg)}
.day{border-top:1px solid var(--line);padding:6px 16px 14px 76px;animation:rise .25s both}
.slot{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:9px 0;font-size:15px;position:relative}
.slot time{color:var(--dim);font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.slot small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;line-height:1.35}
.slot.cur{color:var(--acc);font-weight:700}
.slot.cur time{color:var(--acc)}
.slot.cur small{color:var(--dim);font-weight:400}
.slot.past{opacity:.45}

/* avisos e vazio */
.warn{margin-top:12px;background:color-mix(in srgb,#ffb020 16%,transparent);border:1px solid color-mix(in srgb,#ffb020 35%,transparent);
  color:#ffb020;border-radius:14px;padding:11px 14px;font-size:14px}
@media (prefers-color-scheme: light){.warn{color:#a56a00}}
.empty{text-align:center;color:var(--dim);padding:56px 20px;line-height:1.6}

/* definições */
.sec{margin:22px 0 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:14px}
textarea,input[type=search]{width:100%;background:var(--surface2);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;outline:none}
textarea:focus,input[type=search]:focus{border-color:var(--acc)}
textarea{min-height:104px;resize:vertical}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;cursor:pointer}
.btn.sec2{background:var(--surface2);color:var(--txt);border:1px solid var(--line)}
.msg{margin-top:10px;font-size:13.5px;color:var(--dim);line-height:1.5}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.item input[type=number]{width:52px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--acc);
  text-align:center;font:800 16px var(--font);-moz-appearance:textfield;outline:none}
.item input::-webkit-outer-spin-button,.item input::-webkit-inner-spin-button{-webkit-appearance:none}
.ib{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer}
.ib.rm{color:var(--live)}
.add{cursor:pointer}
.add .plus{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.more{padding:12px 14px;color:var(--dim);font-size:13px}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-top:1px solid var(--line)}
.tabbar div{max-width:640px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{border:0;background:none;border-radius:16px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;transition:.2s}
.tab.on{color:var(--acc);background:var(--glow)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><small id="date"></small><h1>Guia TV</h1></div>
    <div class="clock" id="clock"></div>
  </div>
  <div id="v-now">
    <div class="chips" id="chips"></div>
    <div id="notice"></div>
    <div class="list" id="list"></div>
  </div>
  <div id="v-set" class="hide"></div>
</div>

<div class="tabbar"><div>
  <button class="tab on" id="t-now"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="3"/><path d="M8 21h8M12 17v4"/></svg>Agora</button>
  <button class="tab" id="t-set"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Os meus canais</button>
</div></div>

<script>
const $ = s => document.querySelector(s);
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const hhmm = t => new Date(t*1000).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const missTxt = a => a.slice(0,8).map(esc).join(', ')+(a.length>8?' e mais '+(a.length-8):'');
const dur = m => m>=60 ? Math.floor(m/60)+'h'+String(m%60).padStart(2,'0') : m+' min';

const DEFAULT_LIST = `RTP 1
RTP 2
SIC
TVI
SIC Notícias
RTP 3
CNN Portugal
CMTV
News Now
BTV
Canal 11
Sport TV+
Sport TV 1
Sport TV 2
Sport TV 3
Sport TV 4
Sport TV 5
Sport TV 6
Sport TV 7
DAZN 1
DAZN 2
DAZN 3
DAZN 4
DAZN 5
Eurosport
Eurosport 2
Hollywood
STAR CHANNEL
Star Comedy
Star Movies
Star Crime
Star Life
AXN
AXN Movies
AXN White
NOS Studios
TVCine TOP
TVCine EDITION
TVCine EMOTION
TVCine ACTION
Cinemundo
Syfy
AMC
AMC Break
Crime Investigation
RTP Memória
V+ TVI
SIC Radical
Canal Q
24 Kitchen
Food Network
Casa e Cozinha
Odisseia
História
National Geographic
National Geographic Wild
Discovery
Travel
MTV
MTV 00’s
MCM Top
Mezzo
ARTV
BBC One
BBC Two
BBC Three
BBC Four
CNN
Euronews
Globo
TV Record
SIC Mulher
SIC Caras
Sky Sports F1
DAZN F1
Red Bull TV
Fuel TV
Motorvision
Cartoon Network
Nickelodeon
Disney Channel
SIC K
Baby TV
Nick Jr
Disney Junior
Panda
Panda Biggs
Panda Kids`.split('\n');

let data = {channels:[],programmes:{},generated:0};
let byId = {};
let order = [];
try { order = JSON.parse(localStorage.getItem('order')||'[]'); } catch(e){}
let open = null, tab = 'now', importMsg = '', q = '', when = 'live';

const save = () => { try{ localStorage.setItem('order', JSON.stringify(order)); }catch(e){} };

function matchList(lines){
  const items = data.channels.map(c=>{ const n = norm(c.name); return {c, n, ns:n.replace(/ /g,''), nh:n.replace(/ hd$/,'').replace(/ /g,'')}; });
  const found = [], miss = [];
  for(const l of lines){
    const n = norm(l.replace(/^\d+\s*[\.\)\-]\s*/,''));
    if(!n) continue;
    const ns = n.replace(/ /g,'');
    let m = items.find(x=>x.n===n) || items.find(x=>x.ns===ns) || items.find(x=>x.nh===ns);
    if(!m && ns.length>4){ const cand = items.filter(x=>x.ns.includes(ns)); if(cand.length===1) m = cand[0]; }
    if(m){ if(!found.includes(m.c.id)) found.push(m.c.id); } else miss.push(l);
  }
  return {found, miss};
}

async function load(){
  try{
    const r = await fetch('data/epg.json?'+Date.now());
    data = await r.json();
    byId = Object.fromEntries(data.channels.map(c=>[c.id,c]));
    if(localStorage.getItem('order')===null && data.channels.length){
      const r2 = matchList(DEFAULT_LIST); order = r2.found;
      importMsg = r2.found.length+' canais da tua lista carregados.'+(r2.miss.length?' Não encontrei: '+missTxt(r2.miss)+'.':'');
      save();
    }
    order = order.filter(id=>byId[id]);
  }catch(e){ data.error = true; }
  render();
}

function render(){
  $('#v-now').classList.toggle('hide', tab!=='now');
  $('#v-set').classList.toggle('hide', tab!=='set');
  $('#t-now').classList.toggle('on', tab==='now');
  $('#t-set').classList.toggle('on', tab==='set');
  if(tab==='now') renderNow(); else renderSet();
}

function whenTs(now){
  if(when==='live') return now;
  if(when==='p'){ const d = new Date(); d.setHours(21,0,0,0); return d/1000; }
  return now + (+when)*3600;
}

function renderNow(){
  const now = Date.now()/1000;
  $('#clock').textContent = hhmm(now);
  const ds = new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'}); $('#date').textContent = ds.charAt(0).toUpperCase()+ds.slice(1);

  const prime = new Date(); prime.setHours(21,0,0,0);
  const chips = [['live','Agora'],['1','+1 h'],['2','+2 h']];
  if(prime/1000 > now + 3*3600) chips.push(['p','21:00']);
  if(!chips.some(c=>c[0]===when)) when = 'live';
  $('#chips').innerHTML = chips.map(([k,l])=>'<button class="chip'+(when===k?' on':'')+'" data-w="'+k+'">'+l+'</button>').join('');
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ when=b.dataset.w; renderNow(); });

  let n = '';
  const age = (now - data.generated)/3600;
  if(data.error) n = '<div class="warn">Não consegui carregar a programação.</div>';
  else if(data.generated && age > 36) n = '<div class="warn">A programação não é atualizada há '+Math.floor(age/24)+' dia(s). Verifica a ação no GitHub.</div>';
  $('#notice').innerHTML = n;

  if(!order.length){
    $('#list').innerHTML = '<div class="empty">Ainda não tens canais.<br>Abre “Os meus canais” para os escolher e ordenar.</div>';
    return;
  }
  const at = whenTs(now), isLive = when==='live';
  let h = '';
  order.forEach((id,i)=>{
    const c = byId[id], ps = data.programmes[id]||[];
    const k = ps.findIndex(p=>p[0]<=at && at<p[1]);
    const cur = k>=0 ? ps[k] : null;
    const nxt = k>=0 ? ps[k+1] : ps.find(p=>p[0]>at);
    const isOpen = open===id;
    h += '<article class="card'+(isOpen?' open':'')+'" style="animation-delay:'+Math.min(i,10)*25+'ms"><button class="head" data-id="'+esc(id)+'">'
      + '<div class="badge">'+(i+1)+'</div><div class="info">'
      + '<div class="top"><span class="chname">'+esc(c.name)+'</span>'+(isLive && cur?'<span class="live">AO VIVO</span>':'')+'</div>'
      + (cur
        ? '<div class="title">'+esc(cur[2])+'</div>'
          + (isLive ? '<div class="prog"><i style="width:'+Math.round((now-cur[0])/(cur[1]-cur[0])*100)+'%"></i></div>' : '<div style="height:10px"></div>')
          + '<div class="times"><span>'+hhmm(cur[0])+' – '+hhmm(cur[1])+'</span>'+(isLive?'<span>faltam '+dur(Math.max(1,Math.round((cur[1]-now)/60)))+'</span>':'')+'</div>'
        : '<div class="title none">Sem informação</div>')
      + (nxt ? '<div class="next"><b>'+hhmm(nxt[0])+'</b><span>'+esc(nxt[2])+'</span></div>' : '')
      + '</div><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
    if(isOpen){
      h += '<div class="day">' + ps.filter(p=>p[1]>now-3600).slice(0,40).map(p=>
        '<div class="slot'+(p[0]<=now&&now<p[1]?' cur':(p[1]<=now?' past':''))+'"><time>'+hhmm(p[0])+'</time><span>'+esc(p[2])+(p[3]?'<small>'+esc(p[3])+'</small>':'')+'</span></div>').join('') + '</div>';
    }
    h += '</article>';
  });
  $('#list').innerHTML = h;
  document.querySelectorAll('.head').forEach(r=>r.onclick=()=>{ open = open===r.dataset.id ? null : r.dataset.id; renderNow(); });
}

function renderSet(){
  const sel = new Set(order);
  const nq = norm(q);
  const avail = data.channels.filter(c=>!sel.has(c.id) && (!nq || norm(c.name).includes(nq)));
  const arrow = d => '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="'+(d==='u'?'M6 15l6-6 6 6':'M6 9l6 6 6-6')+'"/></svg>';
  let h = '<div class="sec">Colar a minha lista</div><div class="panel pad">'
    + '<textarea id="paste" placeholder="Um canal por linha, pela ordem da tua TV&#10;RTP 1&#10;RTP 2&#10;SIC"></textarea>'
    + '<div class="btns"><button class="btn" id="imp">Importar</button><button class="btn sec2" id="rst">Lista original</button><button class="btn sec2" id="clr">Limpar</button></div>'
    + (importMsg ? '<div class="msg">'+importMsg+'</div>' : '') + '</div>'
    + '<div class="sec">A minha ordem · '+order.length+'</div><div class="panel">'
    + (order.length ? order.map((id,i)=>'<div class="item"><input type="number" inputmode="numeric" min="1" value="'+(i+1)+'" data-pos="'+i+'"><span class="n">'+esc(byId[id].name)+'</span>'
        +'<button class="ib" data-up="'+i+'" aria-label="Subir">'+arrow('u')+'</button><button class="ib" data-dn="'+i+'" aria-label="Descer">'+arrow('d')+'</button>'
        +'<button class="ib rm" data-rm="'+i+'" aria-label="Remover"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>').join('')
        : '<div class="empty" style="padding:28px">Vazio</div>')
    + '</div><div class="sec">Adicionar canais</div><input type="search" id="q" placeholder="Pesquisar canal…" value="'+esc(q)+'">'
    + '<div class="panel" style="margin-top:10px">'
    + avail.slice(0,60).map(c=>'<div class="item add" data-add="'+esc(c.id)+'"><span class="n">'+esc(c.name)+'</span><span class="plus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div>').join('')
    + (avail.length>60 ? '<div class="more">Mais '+(avail.length-60)+' — usa a pesquisa.</div>' : '')
    + (!avail.length ? '<div class="empty" style="padding:28px">Nada encontrado</div>' : '') + '</div>';
  $('#v-set').innerHTML = h;
  const move = (a,b)=>{ if(b<0||b>=order.length) return; const [x]=order.splice(a,1); order.splice(b,0,x); save(); renderSet(); };
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,+b.dataset.up-1));
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>move(+b.dataset.dn,+b.dataset.dn+1));
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ order.splice(+b.dataset.rm,1); save(); renderSet(); });
  document.querySelectorAll('[data-pos]').forEach(b=>b.onchange=()=>move(+b.dataset.pos, Math.min(order.length,Math.max(1,+b.value||1))-1));
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ order.push(b.dataset.add); save(); renderSet(); });
  $('#q').oninput = e=>{ q=e.target.value; const p=e.target.selectionStart; renderSet(); const el=$('#q'); el.focus(); el.setSelectionRange(p,p); };
  $('#clr').onclick = ()=>{ if(confirm('Apagar a tua lista de canais?')){ order=[]; save(); importMsg=''; renderSet(); } };
  $('#imp').onclick = ()=>{
    const r = matchList($('#paste').value.split('\n').map(x=>x.trim()).filter(Boolean));
    order = r.found; save();
    importMsg = r.found.length+' canais importados.' + (r.miss.length ? ' Não encontrei: '+missTxt(r.miss)+'.' : '');
    renderSet();
  };
  $('#rst').onclick = ()=>{
    const r = matchList(DEFAULT_LIST); order = r.found; save();
    importMsg = r.found.length+' canais da lista original.' + (r.miss.length ? ' Não encontrei: '+missTxt(r.miss)+'.' : '');
    renderSet();
  };
}

$('#t-now').onclick = ()=>{ tab='now'; render(); window.scrollTo(0,0); };
$('#t-set').onclick = ()=>{ tab='set'; render(); window.scrollTo(0,0); };

load();
