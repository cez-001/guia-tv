<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ee">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Guia TV</title>
<style>
:root{
  --pearl:#f6f3ee; --pearl2:#efebe4; --card:#fffdf9; --ink:#1d1b18; --ink2:#4a463f; --mute:#8f887c;
  --hair:#e6e0d5; --gold:#a8865a; --gold2:#c9ad82; --tile:#252320; --live:#b4483c;
  --serif:"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--pearl)}
body{margin:0;color:var(--ink);font:15px/1.4 var(--sans);min-height:100vh;
  background:radial-gradient(1200px 600px at 20% -200px,#fffefb 0%,transparent 60%),
             radial-gradient(900px 500px at 110% 10%,#f1ece4 0%,transparent 55%),var(--pearl);
  background-attachment:fixed;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.wrap{max-width:620px;margin:auto;padding:0 20px}

.hero{padding:calc(env(safe-area-inset-top) + 18px) 0 2px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.hero h1{margin:0;font:400 30px/1 var(--serif);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gold)}
.clock{font:300 24px/1 var(--serif);color:var(--ink2);font-variant-numeric:tabular-nums}
.rule{height:1px;background:linear-gradient(90deg,var(--gold2),var(--hair) 40%,transparent);margin:14px 0 2px}

.list{display:grid;gap:8px;padding:10px 0 8px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 8px 24px -14px rgba(60,45,20,.18);overflow:hidden;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 12px 11px;background:none;border:0;text-align:left;cursor:pointer}
.side{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile{width:54px;height:36px;border-radius:10px;background:var(--tile);display:grid;place-items:center;overflow:hidden;
  box-shadow:0 4px 10px -6px rgba(0,0,0,.45);flex:none}
.tile img{max-width:82%;max-height:76%;object-fit:contain;display:block}
.tile span{color:#f3efe7;font-size:10px;font-weight:600;text-align:center;padding:0 5px;line-height:1.15}
.num{font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.info{flex:1;min-width:0}
.status{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px rgba(180,72,60,.12)}
.title{font:400 17px/1.22 var(--serif);letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title.none{color:var(--mute);font-style:italic;font-size:17px}
.tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--mute)}
.imdb{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font-weight:600;font-size:12.5px}
.imdb b{background:#f5c518;color:#000;font:800 9.5px/1 var(--sans);letter-spacing:.02em;padding:3px 4px;border-radius:3px}
.bar{height:2px;background:var(--pearl2);margin:8px 0 5px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.next{margin-top:8px;padding-top:7px;border-top:1px solid var(--hair)}
.next small{display:block}
.nt{margin-top:2px;font:400 14.5px/1.3 var(--serif);color:var(--ink2)}
.nt time{font:500 12.5px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;margin-right:8px}
.next small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);flex:none}
.next time{font-variant-numeric:tabular-nums;color:var(--ink);flex:none}
.chev{flex:none;color:var(--gold2);transition:transform .3s;margin-top:2px}
.card.open .chev{transform:rotate(180deg)}

.detail{border-top:1px solid var(--hair);background:linear-gradient(#fbf9f5,var(--card));padding:2px 14px 12px;animation:in .3s both}
.day{margin-top:12px}
.dayhead{display:flex;align-items:center;gap:10px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.dayhead::after{content:"";flex:1;height:1px;background:var(--hair)}
.slot{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid rgba(230,224,213,.6);position:relative}
.slot:last-child{border-bottom:0}
.slot time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:2px}
.slot .t{font:400 15px/1.3 var(--serif)}
.slot .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--mute)}
.slot p{margin:3px 0 0;font-size:12px;line-height:1.4;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.cur::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:2px;background:var(--gold)}
.slot.cur time{color:var(--gold);font-weight:600}
.slot.prev{opacity:.55}

.warn{margin-top:14px;border:1px solid #e8d4b0;background:#fbf3e4;color:#7a5a2a;border-radius:14px;padding:11px 14px;font-size:13.5px}
.empty{text-align:center;color:var(--mute);padding:56px 20px;line-height:1.7;font-family:var(--serif);font-style:italic;font-size:17px}

.sec{margin:26px 0 10px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.panel{background:var(--card);border:1px solid var(--hair);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px -16px rgba(60,45,20,.18)}
.pad{padding:16px}
textarea,input[type=search]{width:100%;background:#fbf9f5;color:var(--ink);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;font:16px var(--sans);outline:none}
textarea:focus,input[type=search]:focus{border-color:var(--gold2)}
textarea{min-height:96px;resize:vertical}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--pearl);border-radius:999px;padding:10px 18px;font-size:13.5px;letter-spacing:.02em;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border-color:var(--hair)}
.msg{margin-top:12px;font-size:13px;color:var(--mute);line-height:1.5}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair)}
.item:last-child{border:0}
.item .tile{width:48px;height:32px;border-radius:9px;box-shadow:none}
.item .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.item input[type=number]{width:44px;height:36px;border-radius:10px;border:1px solid var(--hair);background:#fbf9f5;color:var(--ink);
  text-align:center;font:500 14px var(--sans);-moz-appearance:textfield;outline:none}
.item input::-webkit-outer-spin-button,.item input::-webkit-inner-spin-button{-webkit-appearance:none}
.ib{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--hair);background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.ib.rm{color:var(--live)}
.add{cursor:pointer}
.add .plus{flex:none;color:var(--gold);font-size:20px;line-height:1}
.more{padding:12px 14px;color:var(--mute);font-size:13px}

.hr{display:flex;align-items:center;gap:14px}
.menu{width:30px;height:30px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--mute);cursor:pointer}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div><div class="eyebrow" id="date"></div><h1>Guia <em>TV</em></h1></div>
    <div class="hr"><div class="clock" id="clock"></div><button class="menu" id="menu" aria-label="Menu"></button></div>
  </div>
  <div class="rule"></div>
  <div id="v-now">
    <div id="notice"></div>
    <div class="list" id="list"></div>
  </div>
  <div id="v-set" class="hide"></div>
</div>



<script>
const $ = s => document.querySelector(s);
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const hhmm = t => new Date(t*1000).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur = m => m>=60 ? Math.floor(m/60)+'h'+String(m%60).padStart(2,'0') : m+' min';
const missTxt = a => a.slice(0,8).map(esc).join(', ')+(a.length>8?' e mais '+(a.length-8):'');
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const logo = u => (u||'').replace(/\/width\/\d+\/height\/\d+/,'/width/240/height/150');
const dayKey = t => { const d=new Date(t*1000); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
const midnight = (off=0) => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+off); return d/1000; };

const DEFAULT_LIST = `RTP 1
RTP 2
SIC
TVI
SIC Notícias
RTP 3
CNN Portugal
CMTV
News Now
BTV
Canal 11
Sport TV+
Sport TV 1
Sport TV 2
Sport TV 3
Sport TV 4
Sport TV 5
Sport TV 6
Sport TV 7
DAZN 1
DAZN 2
DAZN 3
DAZN 4
DAZN 5
Eurosport
Eurosport 2
Hollywood
STAR CHANNEL
Star Comedy
Star Movies
Star Crime
Star Life
AXN
AXN Movies
AXN White
NOS Studios
TVCine TOP
TVCine EDITION
TVCine EMOTION
TVCine ACTION
Cinemundo
Syfy
AMC
AMC Break
Crime Investigation
RTP Memória
V+ TVI
SIC Radical
Canal Q
24 Kitchen
Food Network
Casa e Cozinha
Odisseia
História
National Geographic
National Geographic Wild
Discovery
Travel
MTV
MTV 00’s
MCM Top
Mezzo
ARTV
BBC One
BBC Two
BBC Three
BBC Four
CNN
Euronews
Globo
TV Record
SIC Mulher
SIC Caras
Sky Sports F1
DAZN F1
Red Bull TV
Fuel TV
Motorvision
Cartoon Network
Nickelodeon
Disney Channel
SIC K
Baby TV
Nick Jr
Disney Junior
Panda
Panda Biggs
Panda Kids`.split('\n');

let data = {channels:[],programmes:{},generated:0};
let byId = {};
let order = [];
try { order = JSON.parse(localStorage.getItem('order')||'[]'); } catch(e){}
let open = null, tab = 'now', importMsg = '', q = '';
const save = () => { try{ localStorage.setItem('order', JSON.stringify(order)); }catch(e){} };

function matchList(lines){
  const items = data.channels.map(c=>{ const n = norm(c.name); return {c, n, ns:n.replace(/ /g,''), nh:n.replace(/ hd$/,'').replace(/ /g,'')}; });
  const found = [], miss = [];
  for(const l of lines){
    const n = norm(l.replace(/^\d+\s*[\.\)\-]\s*/,''));
    if(!n) continue;
    const ns = n.replace(/ /g,'');
    let m = items.find(x=>x.n===n) || items.find(x=>x.ns===ns) || items.find(x=>x.nh===ns);
    if(!m && ns.length>4){ const cand = items.filter(x=>x.ns.includes(ns)); if(cand.length===1) m = cand[0]; }
    if(m){ if(!found.includes(m.c.id)) found.push(m.c.id); } else miss.push(l);
  }
  return {found, miss};
}

async function load(){
  try{
    const r = await fetch('data/epg.json?'+Date.now());
    data = await r.json();
    byId = Object.fromEntries(data.channels.map(c=>[c.id,c]));
    if(localStorage.getItem('order')===null && data.channels.length){
      const r2 = matchList(DEFAULT_LIST); order = r2.found;
      importMsg = r2.found.length+' canais da tua lista carregados.'+(r2.miss.length?' Não encontrei: '+missTxt(r2.miss)+'.':'');
      save();
    }
    order = order.filter(id=>byId[id]);
  }catch(e){ data.error = true; }
  render();
}

function render(){
  $('#v-now').classList.toggle('hide', tab!=='now');
  $('#v-set').classList.toggle('hide', tab!=='set');
  $('#menu').innerHTML = tab==='now'
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  if(tab==='now') renderNow(); else renderSet();
}

function logoFail(img){ const s=document.createElement('span'); s.textContent=img.alt; img.replaceWith(s); }
const tileHTML = c => '<div class="tile">'+(c.icon
  ? '<img src="'+esc(logo(c.icon))+'" alt="'+esc(c.name)+'" loading="lazy" onerror="logoFail(this)">'
  : '<span>'+esc(c.name)+'</span>')+'</div>';

const imdbHTML = p => { const x=p[4]||{}; return x.r ? '<a class="imdb" href="https://www.imdb.com/title/'+esc(x.i)+'/" target="_blank" rel="noopener" onclick="event.stopPropagation()"><b>IMDb</b>'+Number(x.r).toFixed(1)+'</a>' : ''; };
const metaHTML = p => { const x=p[4]||{}; const bits=[]; if(x.g){ const g=x.g.split(', ').filter(v=>!/^filmes?$|^cinema$/i.test(v)).join(', '); if(g) bits.push(esc(g)); } if(x.y && x.f) bits.push(x.y); return bits.join(' · '); };

function dayLabel(t){
  const k = dayKey(t);
  if(k===dayKey(midnight(0))) return 'Hoje';
  if(k===dayKey(midnight(1))) return 'Amanhã';
  const d=new Date(t*1000); return cap(d.toLocaleDateString('pt-PT',{weekday:'long'}).replace('-feira',''))+', '+d.getDate()+' '+d.toLocaleDateString('pt-PT',{month:'short'}).replace('.','');
}

function slotHTML(p, cls){
  const m = metaHTML(p), r = imdbHTML(p);
  return '<div class="slot '+cls+'"><time>'+hhmm(p[0])+'</time><div><div class="t">'+esc(p[2])+'</div>'
    + ((m||r) ? '<div class="m">'+r+(m?'<span>'+m+'</span>':'')+'</div>' : '')
    + (p[3] ? '<p>'+esc(p[3])+'</p>' : '') + '</div></div>';
}

function detailHTML(ps, now){
  const k = ps.findIndex(p=>p[0]<=now && now<p[1]);
  let start = k>=0 ? k : ps.findIndex(p=>p[0]>now);
  if(start<0) start = ps.length;
  let h = '<div class="detail">';
  if(start-1>=0) h += '<div class="day"><div class="dayhead">Anterior</div>'+slotHTML(ps[start-1],'prev')+'</div>';
  const end = midnight(4), groups = [];
  ps.slice(start).filter(p=>p[0]<end).forEach(p=>{
    const lbl = dayLabel(Math.max(p[0], now));
    if(!groups.length || groups[groups.length-1][0]!==lbl) groups.push([lbl,[]]);
    groups[groups.length-1][1].push(p);
  });
  groups.forEach(([lbl,items])=>{
    h += '<div class="day"><div class="dayhead">'+lbl+'</div>'+items.map(p=>slotHTML(p,(p[0]<=now&&now<p[1])?'cur':'')).join('')+'</div>';
  });
  if(!groups.length && start===0) h += '<div class="empty" style="padding:24px">Sem programação disponível</div>';
  return h+'</div>';
}

function renderNow(){
  const now = Date.now()/1000;
  $('#clock').textContent = hhmm(now);
  $('#date').textContent = new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});

  let n = '';
  const age = (now - data.generated)/3600;
  if(data.error) n = '<div class="warn">Não consegui carregar a programação.</div>';
  else if(data.generated && age > 36) n = '<div class="warn">A programação não é atualizada há '+Math.floor(age/24)+' dia(s). Verifica a ação no GitHub.</div>';
  $('#notice').innerHTML = n;

  if(!order.length){
    $('#list').innerHTML = '<div class="empty">Ainda não escolheste canais.<br>Abre “Os meus canais”.</div>';
    return;
  }
  const at = now;
  let h = '';
  order.forEach((id,i)=>{
    const c = byId[id], ps = data.programmes[id]||[];
    const k = ps.findIndex(p=>p[0]<=at && at<p[1]);
    const cur = k>=0 ? ps[k] : null;
    const nxt = k>=0 ? ps[k+1] : ps.find(p=>p[0]>at);
    const isOpen = open===id;
    const m = cur ? metaHTML(cur) : '', r = cur ? imdbHTML(cur) : '';
    h += '<article class="card'+(isOpen?' open':'')+'" style="animation-delay:'+Math.min(i,8)*30+'ms"><button class="head" data-id="'+esc(id)+'">'
      + '<div class="side">'+tileHTML(c)+'<span class="num">'+String(i+1).padStart(2,'0')+'</span></div><div class="info">'
      + (cur
        ? '<div class="title">'+esc(cur[2])+'</div>'
          + ((m||r) ? '<div class="tags">'+r+(m?'<span>'+m+'</span>':'')+'</div>' : '')
          + '<div class="bar"><i style="width:'+Math.round((now-cur[0])/(cur[1]-cur[0])*100)+'%"></i></div>'
          + '<div class="times"><span>'+hhmm(cur[0])+' – '+hhmm(cur[1])+'</span>'+'<span>faltam '+dur(Math.max(1,Math.round((cur[1]-now)/60)))+'</span>'+'</div>'
        : '<div class="title none">Sem informação</div>')
      + (nxt ? '<div class="next"><small>A seguir</small><div class="nt"><time>'+hhmm(nxt[0])+'</time>'+esc(nxt[2])+'</div></div>' : '')
      + '</div><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>';
    if(isOpen) h += detailHTML(ps, now);
    h += '</article>';
  });
  $('#list').innerHTML = h;
  document.querySelectorAll('.head').forEach(r=>r.onclick=()=>{ open = open===r.dataset.id ? null : r.dataset.id; renderNow(); });
}

function renderSet(){
  const sel = new Set(order);
  const nq = norm(q);
  const avail = data.channels.filter(c=>!sel.has(c.id) && (!nq || norm(c.name).includes(nq)));
  const arrow = d => '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+(d==='u'?'M6 15l6-6 6 6':'M6 9l6 6 6-6')+'"/></svg>';
  let h = '<div class="sec" style="font:400 22px var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);margin-top:18px">Os meus canais</div><div class="sec">Colar a minha lista</div><div class="panel pad">'
    + '<textarea id="paste" placeholder="Um canal por linha, pela ordem da tua TV"></textarea>'
    + '<div class="btns"><button class="btn" id="imp">Importar</button><button class="btn ghost" id="rst">Lista original</button><button class="btn ghost" id="clr">Limpar</button></div>'
    + (importMsg ? '<div class="msg">'+importMsg+'</div>' : '') + '</div>'
    + '<div class="sec">A minha ordem · '+order.length+'</div><div class="panel">'
    + (order.length ? order.map((id,i)=>'<div class="item"><input type="number" inputmode="numeric" min="1" value="'+(i+1)+'" data-pos="'+i+'">'+tileHTML(byId[id])+'<span class="n">'+esc(byId[id].name)+'</span>'
        +'<button class="ib" data-up="'+i+'" aria-label="Subir">'+arrow('u')+'</button><button class="ib" data-dn="'+i+'" aria-label="Descer">'+arrow('d')+'</button>'
        +'<button class="ib rm" data-rm="'+i+'" aria-label="Remover"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>').join('')
        : '<div class="empty" style="padding:28px">Vazio</div>')
    + '</div><div class="sec">Adicionar canais</div><input type="search" id="q" placeholder="Pesquisar canal…" value="'+esc(q)+'">'
    + '<div class="panel" style="margin-top:10px">'
    + avail.slice(0,60).map(c=>'<div class="item add" data-add="'+esc(c.id)+'">'+tileHTML(c)+'<span class="n">'+esc(c.name)+'</span><span class="plus">+</span></div>').join('')
    + (avail.length>60 ? '<div class="more">Mais '+(avail.length-60)+' — usa a pesquisa.</div>' : '')
    + (!avail.length ? '<div class="empty" style="padding:28px">Nada encontrado</div>' : '') + '</div>';
  $('#v-set').innerHTML = h;
  const move = (a,b)=>{ if(b<0||b>=order.length) return; const [x]=order.splice(a,1); order.splice(b,0,x); save(); renderSet(); };
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,+b.dataset.up-1));
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>move(+b.dataset.dn,+b.dataset.dn+1));
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ order.splice(+b.dataset.rm,1); save(); renderSet(); });
  document.querySelectorAll('[data-pos]').forEach(b=>b.onchange=()=>move(+b.dataset.pos, Math.min(order.length,Math.max(1,+b.value||1))-1));
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ order.push(b.dataset.add); save(); renderSet(); });
  $('#q').oninput = e=>{ q=e.target.value; const p=e.target.selectionStart; renderSet(); const el=$('#q'); el.focus(); el.setSelectionRange(p,p); };
  $('#clr').onclick = ()=>{ if(confirm('Apagar a tua lista de canais?')){ order=[]; save(); importMsg=''; renderSet(); } };
  $('#imp').onclick = ()=>{
    const r = matchList($('#paste').value.split('\n').map(x=>x.trim()).filter(Boolean));
    order = r.found; save();
    importMsg = r.found.length+' canais importados.' + (r.miss.length ? ' Não encontrei: '+missTxt(r.miss)+'.' : '');
    renderSet();
  };
  $('#rst').onclick = ()=>{
    const r = matchList(DEFAULT_LIST); order = r.found; save();
    importMsg = r.found.length+' canais da lista original.' + (r.miss.length ? ' Não encontrei: '+missTxt(r.miss)+'.' : '');
    renderSet();
  };
}

$('#menu').onclick = ()=>{ tab = tab==='now' ? 'set' : 'now'; render(); window.scrollTo(0,0); };
setInterval(()=>{ if(tab==='now') renderNow(); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ load(); } });
load();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
